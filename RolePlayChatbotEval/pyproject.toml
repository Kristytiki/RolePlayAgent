[project]
name = "roleplaychatboteval"
version = "0.1.0"
description = "CoSER-style evaluation harness (multi-agent simulation + penalty-based judge) for the RolePlayChatbotService."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    # The eval package only talks to the service over HTTP for chat turns
    # (multi-agent simulation), so it does not import roleplaychatbotservice
    # at runtime. The local persona name list is hard-coded here.
]

[project.scripts]
roleplaychatboteval = "roleplaychatboteval.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
